<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón de Respuestas | Carlos Velasco</title>
  <link rel="stylesheet" href="css/styles_premium.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --romantic-primary: #ff4d6d;
      --bg-dark-romantic: #09030b;
      --bg-card-romantic: rgba(30, 15, 35, 0.6);
      --border-romantic: rgba(255, 77, 109, 0.15);
      --gradient-romantic: linear-gradient(135deg, var(--romantic-primary), #7209b7);
    }

    body {
      background-color: var(--bg-dark-romantic);
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 77, 109, 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(114, 9, 183, 0.15) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      padding: 4rem 2rem 4rem;
    }

    .header-box {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header-box h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #fff, var(--romantic-primary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .header-box p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.8rem 1.5rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Outfit', sans-serif;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .responses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .response-card {
      background: var(--bg-card-romantic);
      border: 1px solid var(--border-romantic);
      border-radius: var(--radius-md);
      padding: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      position: relative;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .response-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 77, 109, 0.3);
      box-shadow: 0 15px 35px rgba(255, 77, 109, 0.05);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.8rem;
    }

    .card-title {
      font-weight: 700;
      color: var(--romantic-primary);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .card-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-row {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .card-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-val {
      font-size: 0.95rem;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-notes {
      font-style: italic;
      color: #dfdfdf;
      border-left: 2px solid var(--romantic-primary);
      padding-left: 0.8rem;
      background: rgba(255, 77, 109, 0.05);
    }

    .loading-container {
      text-align: center;
      padding: 4rem;
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    .spinner {
      font-size: 2rem;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
      color: var(--romantic-primary);
    }

    .empty-state {
      text-align: center;
      padding: 4rem;
      color: var(--text-muted);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      max-width: 600px;
      margin: 0 auto;
    }

    .empty-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <!-- Main Dashboard -->
  <main class="main-content container">
    <div class="header-box">
      <h1>Respuestas de la Invitación 💌</h1>
      <p>Aquí se recopilan las propuestas de cena de Omaima</p>
    </div>

    <!-- Controles -->
    <div class="controls">
      <button class="btn-action" onclick="fetchResponses()">
        <i class="fas fa-sync-alt"></i> Actualizar
      </button>
      <button class="btn-action btn-danger" onclick="clearResponses()">
        <i class="fas fa-trash-alt"></i> Limpiar Registro
      </button>
    </div>

    <!-- Contenedor de Respuestas -->
    <div id="responsesContainer">
      <div class="loading-container">
        <div class="spinner"><i class="fas fa-heart"></i></div>
        <p>Cargando respuestas...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" style="padding: 2rem 0; margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.05); background: rgba(9, 3, 11, 0.95);">
    <div class="container">
      <div class="footer-content" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div class="logo">CV.</div>
        <div class="copyright" style="font-size: 0.9rem; color: var(--text-muted);">
          <p>&copy; 2026 Carlos Velasco García.</p>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const url = 'https://kvdb.io/2Zur8MG8M8WtXgNEYQGC7V/respuestas';

    // Cargar respuestas al iniciar
    document.addEventListener("DOMContentLoaded", () => {
      fetchResponses();
    });

    async function fetchResponses() {
      const container = document.getElementById("responsesContainer");
      container.innerHTML = `
        <div class="loading-container">
          <div class="spinner"><i class="fas fa-sync-alt"></i></div>
          <p>Cargando respuestas...</p>
        </div>
      `;

      try {
        const response = await fetch(url);
        
        // Si no se encuentra el recurso, es que todavía no se ha registrado ninguna respuesta (nuevo bucket)
        if (response.status === 404) {
          showEmptyState();
          return;
        }
        
        if (!response.ok) throw new Error("No se pudo obtener los datos");
        
        let list = await response.json();
        
        if (!Array.isArray(list) || list.length === 0) {
          showEmptyState();
          return;
        }

        // Ordenar por fecha descendente (más recientes primero)
        list.reverse();

        renderResponses(list);
      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="empty-state" style="border-color: #ef4444; color: #ef4444;">
            <div class="empty-icon">⚠️</div>
            <h3>Error al conectar con la base de datos</h3>
            <p style="margin-top: 0.5rem; color: var(--text-muted)">Detalle: ${err.message}</p>
            <button class="btn-action" style="margin-top: 1rem;" onclick="fetchResponses()">Reintentar</button>
          </div>
        `;
      }
    }

    function renderResponses(list) {
      const container = document.getElementById("responsesContainer");
      
      let html = `<div class="responses-grid">`;
      
      list.forEach((item, index) => {
        const foodList = Array.isArray(item.foods) ? item.foods.join(", ") : item.foods || '-';
        const notesContent = item.notes ? item.notes : 'Ninguna';
        const notesStyle = item.notes ? 'card-notes' : '';
        
        html += `
          <div class="response-card">
            <div class="card-header">
              <span class="card-title">✨ Propuesta #${list.length - index}</span>
              <span class="card-time">${item.timestamp || 'Fecha desconocida'}</span>
            </div>
            
            <div class="card-row">
              <span class="card-label">🍕 Comida</span>
              <span class="card-val">${foodList}</span>
            </div>
            
            <div class="card-row">
              <span class="card-label">📅 Día</span>
              <span class="card-val">${item.day || '-'}</span>
            </div>
            
            <div class="card-row">
              <span class="card-label">🍵 Bebida</span>
              <span class="card-val">${item.drink || '-'}</span>
            </div>
            
            <div class="card-row">
              <span class="card-label">📝 Notas especiales</span>
              <span class="card-val ${notesStyle}">${notesContent}</span>
            </div>
          </div>
        `;
      });
      
      html += `</div>`;
      container.innerHTML = html;
    }

    function showEmptyState() {
      const container = document.getElementById("responsesContainer");
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🍕</div>
          <h3>Aún no hay respuestas guardadas</h3>
          <p style="margin-top: 0.5rem;">Cuando Omaima complete el cuestionario y genere el plan, sus respuestas aparecerán aquí al instante.</p>
        </div>
      `;
    }

    async function clearResponses() {
      if (!confirm("¿Estás seguro de que quieres limpiar todo el registro de respuestas? Esta acción es irreversible.")) {
        return;
      }

      const container = document.getElementById("responsesContainer");
      container.innerHTML = `
        <div class="loading-container">
          <div class="spinner"><i class="fas fa-sync-alt"></i></div>
          <p>Borrando respuestas...</p>
        </div>
      `;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify([])
        });

        if (!response.ok) throw new Error("No se pudo limpiar la base de datos");
        
        showEmptyState();
      } catch (err) {
        console.error(err);
        alert("Error al intentar borrar las respuestas: " + err.message);
        fetchResponses();
      }
    }
  </script>
</body>

</html>
